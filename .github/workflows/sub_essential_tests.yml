name: Run Essential Tests Workflow

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to run, space separated (Infrastructure Sep10 Sep12 Sep38 Sep6 Sep24 Sep31 Sep45 Platform validation), or "all"'
        default: all
      tests:
        description: 'Optional gradle --tests filter, used with a single suite'
        default: ''
      ignore_cache:
        description: 'Run the suites even if they already passed with the same inputs'
        type: boolean
        default: false
  workflow_call:
    secrets:
      SECRET_SEP10_SIGNING_SEED:
        required: true
      APP__PAYMENT_SIGNING_SEED:
        required: true
      SECRET__KEY:
        required: true
      TEST_CLIENT_WALLET_SECRET:
        required: true
      TEST_CLIENT_WALLET_EXTRA_SIGNER_1_SECRET:
        required: true
      TEST_CLIENT_WALLET_EXTRA_SIGNER_2_SECRET:
        required: true
      TEST_WITHDRAW_FUND_CLIENT_SECRET_1:
        required: true
      TEST_WITHDRAW_FUND_CLIENT_SECRET_2:
        required: true
      TEST_DEPOSIT_FUND_CLIENT_SECRET_1:
        required: true
      TEST_DEPOSIT_FUND_CLIENT_SECRET_2:
        required: true

concurrency:
  group: ap-test-job
  cancel-in-progress: false

env:
  # Anchor Platform secrets
  SECRET_SEP10_SIGNING_SEED: ${{ secrets.SECRET_SEP10_SIGNING_SEED }}
  APP__PAYMENT_SIGNING_SEED: ${{ secrets.APP__PAYMENT_SIGNING_SEED }}
  SECRET__KEY: ${{ secrets.SECRET__KEY }}

  # Test secrets
  TEST_CLIENT_WALLET_SECRET: ${{ secrets.TEST_CLIENT_WALLET_SECRET }}
  TEST_CLIENT_SMART_WALLET_ACCOUNT: ${{ vars.TEST_CLIENT_SMART_WALLET_ACCOUNT }}
  TEST_CLIENT_WALLET_EXTRA_SIGNER_1_SECRET: ${{ secrets.TEST_CLIENT_WALLET_EXTRA_SIGNER_1_SECRET }}
  TEST_CLIENT_WALLET_EXTRA_SIGNER_2_SECRET: ${{ secrets.TEST_CLIENT_WALLET_EXTRA_SIGNER_2_SECRET }}
  TEST_WITHDRAW_FUND_CLIENT_SECRET_1: ${{ secrets.TEST_WITHDRAW_FUND_CLIENT_SECRET_1 }}
  TEST_WITHDRAW_FUND_CLIENT_SECRET_2: ${{ secrets.TEST_WITHDRAW_FUND_CLIENT_SECRET_2 }}
  TEST_DEPOSIT_FUND_CLIENT_SECRET_1: ${{ secrets.TEST_DEPOSIT_FUND_CLIENT_SECRET_1 }}
  TEST_DEPOSIT_FUND_CLIENT_SECRET_2: ${{ secrets.TEST_DEPOSIT_FUND_CLIENT_SECRET_2 }}

jobs:
  changes:
    name: Pick Essential Suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      validation: ${{ steps.pick.outputs.validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the suites to test
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.suites }}
        run: |
          all="Infrastructure Sep10 Sep12 Sep38 Sep6 Sep24 Sep31 Sep45 Platform validation"
          if [ "$EVENT" = pull_request ]; then
            picked=$(bash scripts/ci/essential-suites.sh select "$BASE")
          elif [ -n "$WANTED" ] && [ "$WANTED" != all ]; then
            picked="$WANTED"
          else
            picked="$all"
          fi
          fingerprints=$(bash scripts/ci/essential-suites.sh fingerprints)
          fingerprint() { echo "$fingerprints" | awk -v s="$1" '$1 == s { print $2 }'; }
          entries=""
          for s in $picked; do
            case " $all " in *" $s "*) ;; *) echo "Unknown suite: $s"; exit 1 ;; esac
            [ "$s" = validation ] && continue
            entries="$entries{\"suite\":\"$s\",\"fingerprint\":\"$(fingerprint "$s")\"},"
          done
          echo "matrix=[${entries%,}]" >> "$GITHUB_OUTPUT"
          if [[ " $picked " == *" validation "* ]]; then
            echo "validation=$(fingerprint validation)" >> "$GITHUB_OUTPUT"
          fi
          echo "Testing: ${picked:-nothing (no essential test input changed)}" >> "$GITHUB_STEP_SUMMARY"

  suite_tests:
    name: Run ${{ matrix.suite }} Tests
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Look up a pass with the same inputs
        id: passed
        if: inputs.ignore_cache != true
        uses: actions/cache/restore@v4
        with:
          path: essential-passed
          key: essential-passed-${{ matrix.suite }}-${{ matrix.fingerprint }}
          lookup-only: true

      - name: Already passed
        if: steps.passed.outputs.cache-hit == 'true'
        run: echo "${{ matrix.suite }} already passed with fingerprint ${{ matrix.fingerprint }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Download anchor-platform.tar
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: anchor-platform-tar
          path: /home/runner/

      - name: Extract anchor-platform.tar
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          cd /home/runner
          tar -xf /home/runner/anchor-platform.tar

      - name: Set up hostnames (/etc/hosts)
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          sudo echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 kafka" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 sep24-reference-ui" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 reference-server" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 reference-db" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 wallet-server" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 platform" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Run Kafka, Postgres, and Sep24 UI with docker compose
        if: steps.passed.outputs.cache-hit != 'true'
        run: docker compose -f /home/runner/anchor-platform/service-runner/src/main/resources/docker-compose-test.yaml up -d --build

      - name: Start `default` configuration
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          TEST_PROFILE_NAME: default
          SEP1_TOML_VALUE: /home/runner/anchor-platform/service-runner/src/main/resources/config/stellar.host.docker.internal.toml
          SEP10_WEB_AUTH_DOMAIN: host.docker.internal:8080
          SEP10_HOME_DOMAINS: host.docker.internal:8080,*.stellar.org
          SEP45_WEB_AUTH_DOMAIN: host.docker.internal:8080
          SEP45_HOME_DOMAINS: host.docker.internal:8080,*.stellar.org
          TOML_PATH: /home/runner/anchor-platform/wallet-reference-server/src/main/resources/toml
          KT_REFERENCE_SERVER_CONFIG: /home/runner/anchor-platform/service-runner/src/main/resources/config/reference-config.yaml
        run: |
          cd /home/runner/anchor-platform
          ./gradlew startServersWithTestProfile &
          echo "PID=$!" >> $GITHUB_ENV

      - name: Wait for the sep server to start and get ready
        if: steps.passed.outputs.cache-hit != 'true'
        uses: mydea/action-wait-for-api@v1
        with:
          url: "http://host.docker.internal:8080/.well-known/stellar.toml"
          interval: "1"
          timeout: "600"

      - name: Run ${{ matrix.suite }} Tests
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          TEST_PROFILE_NAME: default
          RUN_DOCKER: false
          ANCHOR_DOMAIN: http://host.docker.internal:8080
          TESTS: ${{ inputs.tests }}
        run: |
          cd /home/runner/anchor-platform
          make "run-$(echo '${{ matrix.suite }}' | tr '[:upper:]' '[:lower:]')-tests"

      - name: Mark these inputs as passed
        if: steps.passed.outputs.cache-hit != 'true' && !inputs.tests
        run: echo "${{ github.run_id }}" > essential-passed

      - name: Save the pass
        if: steps.passed.outputs.cache-hit != 'true' && !inputs.tests
        uses: actions/cache/save@v4
        with:
          path: essential-passed
          key: essential-passed-${{ matrix.suite }}-${{ matrix.fingerprint }}

      - name: Upload ${{ matrix.suite }} Tests report
        if: always() && steps.passed.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-tests-report-${{ github.run_attempt }}
          path: /home/runner/anchor-platform/essential-tests/build/reports/
          retention-days: 7

  stellar_validation:
    name: Run Stellar Validation Tool
    needs: [changes, suite_tests]
    if: ${{ !cancelled() && needs.changes.outputs.validation != '' && contains(fromJSON('["success","skipped"]'), needs.suite_tests.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Look up a pass with the same inputs
        id: passed
        if: inputs.ignore_cache != true
        uses: actions/cache/restore@v4
        with:
          path: essential-passed
          key: essential-passed-validation-${{ needs.changes.outputs.validation }}
          lookup-only: true

      - name: Already passed
        if: steps.passed.outputs.cache-hit == 'true'
        run: echo "Stellar validation already passed with fingerprint ${{ needs.changes.outputs.validation }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Download anchor-platform.tar
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: anchor-platform-tar
          path: /home/runner/

      - name: Extract anchor-platform.tar
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          cd /home/runner
          tar -xf /home/runner/anchor-platform.tar

      - name: Set up hostnames (/etc/hosts)
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          sudo echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 kafka" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 sep24-reference-ui" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 reference-server" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 reference-db" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 wallet-server" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 platform" | sudo tee -a /etc/hosts
          sudo echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Pull Stellar Validation Tests Docker Image
        if: steps.passed.outputs.cache-hit != 'true'
        run: docker pull stellar/anchor-tests:v0.6.22@sha256:a231b1df8262b57448ebbad9be588e871003402b67258a06e145368e9d684229 &

      - name: Run Kafka, Postgres, and Sep24 UI with docker compose
        if: steps.passed.outputs.cache-hit != 'true'
        run: docker compose -f /home/runner/anchor-platform/service-runner/src/main/resources/docker-compose-test.yaml up -d --build

      - name: Start `default` configuration
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          TEST_PROFILE_NAME: default
          SEP1_TOML_VALUE: /home/runner/anchor-platform/service-runner/src/main/resources/config/stellar.host.docker.internal.toml
          SEP10_WEB_AUTH_DOMAIN: host.docker.internal:8080
          SEP10_HOME_DOMAINS: host.docker.internal:8080,*.stellar.org
          SEP45_WEB_AUTH_DOMAIN: host.docker.internal:8080
          SEP45_HOME_DOMAINS: host.docker.internal:8080,*.stellar.org
          TOML_PATH: /home/runner/anchor-platform/wallet-reference-server/src/main/resources/toml
          KT_REFERENCE_SERVER_CONFIG: /home/runner/anchor-platform/service-runner/src/main/resources/config/reference-config.yaml
        run: |
          cd /home/runner/anchor-platform
          ./gradlew startServersWithTestProfile &
          echo "PID=$!" >> $GITHUB_ENV

      - name: Wait for the sep server to start and get ready
        if: steps.passed.outputs.cache-hit != 'true'
        uses: mydea/action-wait-for-api@v1
        with:
          url: "http://host.docker.internal:8080/.well-known/stellar.toml"
          interval: "1"
          timeout: "600"

      - name: Run Stellar validation tool
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          docker run --network host -v /home/runner/anchor-platform/platform/src/test/resources://config stellar/anchor-tests:v0.6.22@sha256:a231b1df8262b57448ebbad9be588e871003402b67258a06e145368e9d684229 --home-domain http://host.docker.internal:8080 --seps 1 6 10 12 24 31 38 --sep-config //config/stellar-anchor-tests-sep-config.json --asset-code USDC --verbose

      - name: Mark these inputs as passed
        if: steps.passed.outputs.cache-hit != 'true'
        run: echo "${{ github.run_id }}" > essential-passed

      - name: Save the pass
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: essential-passed
          key: essential-passed-validation-${{ needs.changes.outputs.validation }}

  essential_tests:
    name: Essential Tests
    needs: [changes, suite_tests, stellar_validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.suite_tests.result }}" "${{ needs.stellar_validation.result }}"; do
            case "$r" in success|skipped) ;; *) echo "Essential tests failed: $r"; exit 1 ;; esac
          done
          echo "All selected essential suites passed."
